# BUILD_ORDER Step 1, task 1.8:
#   "Add the specification validators to CI (run the Phase 2/3 checks on every
#    push) — keeps docs and code from drifting."
#
# Fast by design: the spec suite is stdlib + jsonschema only, so a failure
# shows up in seconds without installing the ML stack.

name: spec-validators

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tools/spec_checks uses `git ls-files` to assert the six
          # specification files are actually published.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-spec-${{ hashFiles('tools/requirements.txt') }}

      - name: Install spec-check dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run specification validators
        run: python -m tools.validate_specs
