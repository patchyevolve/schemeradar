# SchemeRadar — local development infrastructure
# ARCHITECTURE §5.3 (Storage & Retrieval Layer) · BUILD_ORDER Step 1 task 1.3
#
#   MongoDB   27017        canonical Scheme + operational collections
#   Qdrant    6333/6334    vector collection `schemes` (1024-dim, cosine)
#   MinIO     9000/9001    S3-compatible object storage for verification snapshots
#
# These ports are LOCAL DEVELOPMENT DEFAULTS only — they are not part of the
# frozen canonical constants (ARCHITECTURE §9).
#
# Usage:  docker compose up -d && docker compose ps

name: schemeradar

services:
  mongo:
    image: mongo:7
    container_name: schemeradar-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    # Must match the pinned `qdrant-client` in services/api/requirements.txt —
    # the client refuses to talk to a server whose major version differs (it
    # emits "incompatible with server version"). Client and server are both 1.19.1.
    image: qdrant/qdrant:v1.19.1
    container_name: schemeradar-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget; bash /dev/tcp is the
      # portable option (ARCHITECTURE §5.3.1 — port 6333 is the HTTP API).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    # NOTE: the official `minio/minio` image was withdrawn from Docker Hub
    # (registry returns 404 "object not found"). `bitnamilegacy/minio` is the
    # archived Bitnami community image and is S3-compatible — all we need for
    # snapshots at snapshots/{scheme_id}/{job_id}.png (ARCHITECTURE §5.3.4).
    image: bitnamilegacy/minio:2025.7.23
    container_name: schemeradar-minio
    restart: unless-stopped
    # No `command:` override — the image declares volume /bitnami/minio/data and
    # starts via /opt/bitnami/scripts/minio/run.sh (user 1001). Pointing the
    # server at a bare `/data` path makes it exit with
    # "FATAL Unable to initialize backend: file access denied".
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-schemeradar}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-schemeradar_dev_secret}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mongo_data:
  qdrant_data:
  minio_data:
